version: "3.9"

# Pin the project name so container/network/volume names don't depend on the folder name
name: boostseo

services:
  boostseo-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: boostseo-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - boostseo-comments-data:/app/data

  boostseo-frontend:
    build:
      context: ./frontend
    container_name: boostseo-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:80"
    depends_on:
      - boostseo-backend

volumes:
  boostseo-comments-data:
